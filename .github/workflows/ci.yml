name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: lint · typecheck · tests · build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/asta
      JWT_SECRET: ci-placeholder-secret
      NEXTAUTH_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build (Vite)
        run: npm run build
